syntax = "proto3";

package bldc;

// Telemetry values use fixed engineering units so the firmware neither needs
// floating point nor loses precision on the wire.
message Telemetry {
  uint32 protocol_version = 1;
  uint32 sequence = 2;
  uint32 uptime_ms = 3;
  uint32 bus_voltage_mv = 4;
  sint32 phase_current_ma = 5;
  uint32 motor_rpm = 6;
  sint32 mosfet_temperature_cdec = 7;
  // Raw 12-bit ADC code sampled from NTC_PCB (PA6 / ADC2_IN3).
  uint32 ntc_pcb_adc_raw = 8;
  uint32 curr_a_adc_raw = 9;
  uint32 curr_b_adc_raw = 10;
  uint32 curr_c_adc_raw = 11;
  uint32 volt_a_adc_raw = 12;
  uint32 volt_b_adc_raw = 13;
  uint32 volt_c_adc_raw = 14;
  uint32 vbus_adc_raw = 15;
}
