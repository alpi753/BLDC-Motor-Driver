# Board defconfig — stm32f411_demo
# TIM1: INHA/B/C (CH1/2/3) + INLB/C (CH2N/CH3N).  INLA on PC13 via GPIO.
CONFIG_BLDC_BOARD_NAME="stm32f411"
CONFIG_STM32_FAMILY="F4"
CONFIG_BLDC_PWM_LAYOUT=COMPLEMENTARY
CONFIG_BLDC_PWM_TIMER_HIGH=1
CONFIG_BLDC_PWM_TIMER_HIGH_IS_ADVANCED=y
CONFIG_BLDC_PWM_TIMER_LOW=0
CONFIG_BLDC_PWM_TIMER_AUX=0
CONFIG_BLDC_HAS_USB_TELEM=y
CONFIG_BLDC_TELEM_USE_DEMO=n
CONFIG_BLDC_ADC_DMA_CHANNELS=6